[project]
name = "financial-document-risk-review"
version = "0.1.0"
description = "财务单据智能风险审核系统"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "celery[redis]>=5.4,<6.0",
    "PyJWT>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = ["httpx>=0.28,<1.0", "mypy>=1.15,<2.0", "pytest>=8.3,<9.0", "ruff>=0.9,<1.0"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
