[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "financial-document-risk-review"
version = "0.1.0"
description = "财务单据智能风险审核系统"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "greenlet==3.1.1",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pillow==10.4.0",
    "asyncpg>=0.30,<1.0",
    "celery[redis]>=5.4,<6.0",
    "argon2-cffi>=23.1,<26.0",
    "PyJWT>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "paddlepaddle==3.2.0",
    "paddleocr>=3.7.0",
    "minio>=7.2,<8.0",
]

[project.optional-dependencies]
rag = [
    "pymilvus>=2.5,<3.0",
    "httpx>=0.28,<1.0",
]

[dependency-groups]
dev = ["httpx>=0.28,<1.0", "mypy>=1.15,<2.0", "pytest>=8.3,<9.0", "ruff>=0.9,<1.0"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = ["--basetemp=var/pytest"]

[tool.hatch.build.targets.wheel]
packages = ["app", "engines", "evaluation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
