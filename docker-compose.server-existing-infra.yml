services:
  # 复用服务器已有的 risk 项目基础设施，不启动第二套 PostgreSQL/Redis/MinIO。
  # Milvus 及其 etcd/MinIO 由本项目负责，三项服务加入已有外部网络。
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command:
      - etcd
      - --advertise-client-urls=http://milvus-etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://milvus-etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=default=http://milvus-etcd:2380
      - --initial-cluster-state=new
      - --data-dir=/etcd
    volumes:
      - financial_review_milvus_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ACCESS_KEY:-milvusadmin}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_SECRET_KEY:-milvusadmin123}
    volumes:
      - financial_review_milvus_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY:-milvusadmin}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_KEY:-milvusadmin123}
    volumes:
      - financial_review_milvus_data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - app-network
    restart: unless-stopped

  api:
    env_file: !override
      - ${INFRA_ENV_FILE:-/root/risk/.env}
    environment:
      MILVUS_URI: http://milvus:19530
    depends_on: !override
      milvus:
        condition: service_healthy
    networks:
      app-network:
        aliases:
          - financial-review-api

  worker:
    env_file: !override
      - ${INFRA_ENV_FILE:-/root/risk/.env}
    environment:
      MILVUS_URI: http://milvus:19530
    depends_on: !override
      milvus:
        condition: service_healthy
    networks:
      app-network:
        aliases:
          - financial-review-worker

networks:
  app-network:
    external: true
    name: ${INFRA_NETWORK_NAME:-risk_app-network}

volumes:
  financial_review_milvus_etcd_data:
  financial_review_milvus_minio_data:
  financial_review_milvus_data:
